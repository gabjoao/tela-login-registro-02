<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="">
    <title>Login</title>
</head>
<body>
    <aside class="criar">
        <img id="bg1" src="/assets/bg-effect-1.png" alt="">
        <header>
            <p>Lorem ipsum dolor sit amet consectetur.</p>
        </header>

        <h1>Não possui conta?</h1>

        <main>
            <picture>
                <div class="img"></div>
            </picture>
    
            <h2>Crie sua conta agora e comece a usar! É <i><b>rápido</b></i> e <i><b>gratuito</b></i>.</h2>
        </main>
      
        <a href="">
            <div id="registro-btn">
                <p>Criar conta</p>
            </div>
        </a>

        <footer>
            <p>Lorem ipsum dolor sit amet consectetur.</p>
        </footer>
        <img id="bg2" src="/assets/bg-effect-1.png" alt="">
    </aside>

    <aside class="login">
        <img id="bg3" src="assets/bg-effect-2.png" alt="">

        <div class="content1">
            <h1>Fazer login</h1>

            <div class="links">
                <div class="link">
                    <img src="/assets/instagram.png" alt="">
                </div>
                <div class="link">
                    <img src="/assets/google.png" alt="">
                </div>
                <div class="link" id="github">
                    <img src="/assets/github.png" alt="">
                </div>
                <div class="link" id="facebook">
                    <img src="/assets/facebook.png" alt="">
                </div>
            </div>
    
            <div class="linha">
                <div></div>
                <p>ou use seu e-mail:</p>
                <div></div>
            </div>
        </div>
    

        <form action="">
            <div class="email">
                <label for="email">E-mail</label>
                <input type="email" name="email" id="email" required>
            </div>
            
            <div class="senha">
                <label for="senha">Senha</label>
                <div class="senha-input">
                    <input type="password" name="senha" id="senha" required>
                    <img src="/assets/password.png" alt="">
                </div>

                <a href="">
                    <u><p>Esqueci minha senha</p></u> 
                </a>
            </div>

            <input id="login-btn" type="submit" value="Login">

        </form>

        <img id="bg4" src="assets/bg-effect-2.png" alt="">

        <footer>
            <p>Lorem ipsum dolor sit amet consectetur.</p>
        </footer>

    </aside>
</body>
</html>
